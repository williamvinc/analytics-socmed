version: '3.8'

services:
  mysql:
    image: mysql:8.0.41-debian
    container_name: mysql_cpcm
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mynetwork

volumes:
  mysql_data:
    driver: local

networks:
  mynetwork:
    driver: bridge
